# CorrDiff Stage 1 (regression) training config for our ERA5->CONUS404 data.
# Copied/adapted from physicsnemo_src/examples/weather/corrdiff/conf/config_training_custom.yaml.
#
# Usage (from external/corrdiff/physicsnemo_src/examples/weather/corrdiff/):
#   python train.py --config-path=../../../../../conf --config-name=config_training_era5conus404_regression

hydra:
    job:
        chdir: false
        name: era5conus404_regression
    run:
        dir: ./external/corrdiff/output/${hydra:job.name}
    searchpath:
        - pkg://conf/base

defaults:
    - model: regression
    - model_size: normal
    - training: ${model}

dataset:
    type: /gpfsm/dnb33/hpmille1/diffusion_downscaling_model/external/corrdiff/dataset.py::Era5Conus404Dataset
    cache_dir: /discover/nobackup/sduan/.data
    norm_stats_path: /gpfsm/dnb33/hpmille1/diffusion_downscaling_model/norm_stats.npz
    years: [1980, 1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989, 1990,
            1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001,
            2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012,
            2013, 2014]
    input_variables: [t2m, d2m, u10, v10, sp, tp]
    output_variables: [T2, TD2, U10, V10, PSFC, PREC_ACC_NC]
    invariant_variables: [terrain, orog_var, lat, lon, lai, lsm]
    crop_size: 448
    min_land_frac: 0.8

validation:
    years: [2015, 2016, 2017]

training:
    hp:
        training_duration: 5000000
        total_batch_size: 64
        batch_size_per_gpu: "auto"
        lr: 0.0002
        lr_rampup: 1000000
    io:
        checkpoint_dir: /gpfsm/dnb33/hpmille1/diffusion_downscaling_model/external/corrdiff/checkpoints_regression
        print_progress_freq: 1000
        save_checkpoint_freq: 100000
        validation_freq: 50000
        validation_steps: 10

wandb:
    mode: disabled
    results_dir: ./external/corrdiff/wandb
    watch_model: false
